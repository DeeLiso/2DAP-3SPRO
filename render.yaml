services:
  - type: web
    name: 2dap-3spro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /login/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: postgres
      # Neon connection string, pasted into the Render dashboard at deploy time.
      # Set it in the service Environment tab, not in this file.
      - key: DATABASE_URL
        sync: false

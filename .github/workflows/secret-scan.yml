name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan tracked files
        run: python twod_secret_scan.py --all

      - name: Scan full history
        run: |
          if git log -p --all | grep -nE 'rnd_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "::error::credentials found in git history - rotate them"
            exit 1
          fi
          echo "history clean"

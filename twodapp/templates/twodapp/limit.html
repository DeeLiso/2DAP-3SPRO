<!DOCTYPE html>
{% load static %}
<html lang="my" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Limit ဂဏန်းများ</title>
    <script>
        tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="{% static 'css/dark.css' %}" rel="stylesheet">
    <script src="{% static 'js/dark.js' %}"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="{% static 'js/security.js' %}" defer></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-overflow-scrolling: touch;
        }
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
        button, a {
            touch-action: manipulation;
        }
        .safe-bottom {
            padding-bottom: max(env(safe-area-inset-bottom), 0.5rem);
        }

        /* ===== Card entrance animation ===== */
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(18px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .anim-card {
            animation: fadeUp 0.45s ease-out both;
        }

        /* ===== Red pulse ring for over-limit number chips ===== */
        @keyframes redPulse {
            0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); }
            70% { box-shadow: 0 0 0 9px rgba(239,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
        }
        .over-chip {
            animation: redPulse 1.8s ease-out infinite;
        }

        /* ===== Card hover lift + glow ===== */
        .rec-card {
            transition: all 0.25s ease;
        }
        .rec-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -6px rgba(239,68,68,0.35), 0 4px 12px rgba(0,0,0,0.08);
            border-color: #f87171;
        }

        /* ===== Stat number count-up glow ===== */
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 6px rgba(239,68,68,0.6); }
            50% { text-shadow: 0 0 18px rgba(239,68,68,1); }
        }
        .stat-big {
            animation: glowPulse 2.4s ease-in-out infinite;
        }

        /* ===== Empty state ===== */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float-icon {
            animation: float 3s ease-in-out infinite;
        }

        /* ===== Small phone refinements ===== */
        @media (max-width: 640px) {
            body { font-size: 14px; }
            .card-pad { padding: 0.625rem; }
        }

        .tab-item { color: #6b7280; transition: color 0.15s, transform 0.12s; }
        .tab-item:active { transform: scale(0.88); }
        .tab-item.active { color: #dc2626; }
        .tab-item.active i { text-shadow: 0 0 8px rgba(220,38,38,0.3); }

        .tab-item-sidebar { transition: background-color 0.15s, color 0.15s, transform 0.12s; }
        .tab-item-sidebar:active { transform: scale(0.88); }
        .tab-item-sidebar.active { background-color: #fef2f2; color: #dc2626; }
    </style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="2DAP-3SPRO">
    <meta name="theme-color" content="#4338ca">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/static/favicon-192x192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/static/icon-180.png" sizes="180x180">
    <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col overflow-x-hidden lg:pl-16">

    <input type="hidden" id="csrfToken" value="{{ csrf_token }}">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14 sm:h-16 gap-1.5">
                <div class="flex items-center gap-1.5 sm:gap-3 min-w-0 flex-1">
                    <a href="/" class="p-2 rounded-md hover:bg-red-500 focus:outline-none shrink-0">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <span class="font-bold text-sm sm:text-xl tracking-tight truncate min-w-0">
                        <i class="fas fa-exclamation-triangle mr-2"></i> Limit ဂဏန်းများ
                    </span>
                </div>
                <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
                    <div class="text-xs sm:text-sm font-medium bg-red-500/80 px-2 sm:px-3 py-1 rounded-full shadow-inner whitespace-nowrap">
                        <span id="overCount">0</span><span class="hidden sm:inline"> ခု ကျော်နေသည်</span>
                    </div>
                    <form method="post" action="{% url 'logout' %}" class="flex items-center gap-1.5">
                        {% csrf_token %}
                        <span class="hidden md:inline text-xs text-red-100 font-semibold max-w-[120px] truncate">
                            <i class="fas fa-user-circle mr-1"></i>{{ user.username }}
                        </span>
                        <button type="submit" title="Logout"
                                class="p-2 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-100 transition transform hover:scale-105">
                            <i class="fas fa-sign-out-alt text-sm"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex fixed left-0 top-14 bottom-0 w-16 bg-white border-r border-gray-200 z-40 flex-col items-center py-4 gap-1">
        <a href="/bet/?type=dealer" class="tab-item-sidebar w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" data-page="home" title="Home">
            <i class="fas fa-home text-base"></i>
        </a>
        <a href="/records/" class="tab-item-sidebar w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" data-page="records" title="မှတ်တမ်း">
            <i class="fas fa-list-ol text-base"></i>
        </a>
        <a href="/ledger/" class="tab-item-sidebar w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-600 transition" data-page="ledger" title="Ledger">
            <i class="fas fa-th text-base"></i>
        </a>

        <a href="/chat/" class="tab-item-sidebar w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-blue-50 hover:text-blue-600 transition" data-page="chat" title="Chat">
            <i class="fas fa-comments text-base"></i>
        </a>
        <a href="/settings/" class="tab-item-sidebar w-10 h-10 rounded-xl flex items-center justify-center text-gray-400 hover:bg-purple-50 hover:text-purple-600 transition" data-page="settings" title="Settings">
            <i class="fas fa-cog text-base"></i>
        </a>
    </aside>
    <div class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 shadow-[0_-2px_12px_rgba(0,0,0,0.06)] lg:hidden" style="padding-bottom: env(safe-area-inset-bottom, 0px);">
        <div class="flex items-center justify-around px-1">
            <a href="/bet/?type=dealer" class="tab-item flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1" data-page="home">
                <i class="fas fa-home text-[18px]"></i>
                <span class="leading-none">Home</span>
            </a>
            <a href="/records/" class="tab-item flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1" data-page="records">
                <i class="fas fa-list-ol text-[18px]"></i>
                <span class="leading-none">မှတ်တမ်း</span>
            </a>
            <a href="/ledger/" class="tab-item flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1" data-page="ledger">
                <i class="fas fa-th text-[18px]"></i>
                <span class="leading-none">Ledger</span>
            </a>

            <a href="/chat/" class="tab-item flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1" data-page="chat">
                <i class="fas fa-comments text-[18px]"></i>
                <span class="leading-none">Chat</span>
            </a>
            <a href="/settings/" class="tab-item flex flex-col items-center gap-0.5 py-2 px-1 rounded-xl text-[10px] font-bold min-w-0 flex-1" data-page="settings">
                <i class="fas fa-cog text-[18px]"></i>
                <span class="leading-none">Settings</span>
            </a>
        </div>
    </div>

    <main class="flex-1 w-full max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-4 sm:py-6 pb-24 lg:pb-6 safe-bottom">

        <!-- Over-limit numbers summary -->
        <div id="overSummary" class="bg-white rounded-xl shadow-md p-3 sm:p-4 border border-gray-100 mb-4"></div>

        <!-- Over-limit bettors / records -->
        <div id="recordsWrap">
            <div class="flex items-center justify-between mb-3 gap-2">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 min-w-0"><i class="fas fa-users mr-2 text-red-500"></i> Limit ကျော်နေတဲ့ ထိုးသူများ</h2>
                <span class="text-xs text-gray-500 font-semibold bg-gray-100 px-2 py-1 rounded-full whitespace-nowrap shrink-0">Showing <span id="recCount">0</span></span>
            </div>
            <div id="recordsBody" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3"></div>
        </div>
    </main>

    <script>
        const OVER = {{ over_limits_json|safe }};
        const LOGS = {{ logs_json|safe }};

        function fmt(n) { return Number(n || 0).toLocaleString(); }

        // ===== Over-limit summary chips =====
        const summaryEl = document.getElementById('overSummary');
        summaryEl.innerHTML = `
            <div class="flex flex-wrap items-center gap-2 mb-2">
                <h3 class="text-sm font-bold text-gray-700 mr-1"><i class="fas fa-fire mr-1 text-red-500"></i>Limit ကျော်နေတဲ့ ဂဏန်းများ</h3>
                <span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-0.5 rounded-full">${OVER.length} ဂဏန်း</span>
            </div>
            <div class="flex flex-wrap gap-2">
                ${OVER.map((o) => `
                    <div class="flex items-center gap-2 bg-gradient-to-r from-red-50 to-rose-50 border border-red-200 rounded-xl px-2.5 sm:px-3 py-2 transition transform hover:scale-105 hover:shadow-md max-w-full" title="နံပါတ် ${o.num}">
                        <span class="over-chip bg-red-600 text-white font-extrabold text-sm px-2 py-0.5 rounded-lg font-mono shrink-0">${o.num}</span>
                        <div class="text-xs leading-tight min-w-0">
                            <div class="font-bold text-red-700">${fmt(o.amount)} / ${fmt(o.limit)} Ks</div>
                            <div class="text-red-500 font-semibold">+${fmt(o.over)} Ks ကျော်</div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        document.getElementById('overCount').textContent = OVER.length;

        // ===== Records list =====
        const body = document.getElementById('recordsBody');
        const totalOver = LOGS.reduce((s, r) => s + r.over_detail.reduce((a, o) => a + o.over, 0), 0);
        document.getElementById('recCount').textContent = LOGS.length;

        if (!LOGS.length) {
            body.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-10 sm:py-16 text-gray-400 px-2 text-center">
                    <div class="float-icon text-5xl mb-3"><i class="fas fa-check-circle text-green-400"></i></div>
                    <div class="font-bold text-base sm:text-lg text-gray-500">Limit ကျော်နေတာ မရှိပါ</div>
                    <div class="text-sm">ဂဏန်းအားလုံး limit အတွင်းမှာ ရှိနေပါတယ်</div>
                </div>`;
        } else {
            LOGS.forEach((r, idx) => {
                const card = document.createElement('div');
                card.className = 'anim-card rec-card bg-white border border-red-100 rounded-xl p-2.5 sm:p-3 shadow-sm flex flex-col gap-2 min-w-0 w-full';
                card.style.animationDelay = (idx * 45) + 'ms';

                const nums = r.numbers.map((n) => {
                    const over = r.over_detail.find((o) => o.num === n);
                    if (over) {
                        return `<span class="over-chip inline-block bg-gradient-to-br from-red-600 to-rose-600 text-white text-xs font-extrabold px-1.5 py-0.5 rounded font-mono" title="${over.num}: ${fmt(over.amount)}/${fmt(over.limit)} Ks (+${fmt(over.over)} Ks)">${n} ⚠️</span>`;
                    }
                    return `<span class="inline-block bg-gray-100 text-gray-500 text-xs font-bold px-1.5 py-0.5 rounded font-mono">${n}</span>`;
                }).join(' ');

                const overInfo = r.over_detail.map((o) =>
                    `${o.num} → ${fmt(o.amount)}/${fmt(o.limit)} Ks (+${fmt(o.over)} Ks)`
                ).join(' | ');

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <span class="inline-flex items-center gap-1.5 text-indigo-700 font-bold text-sm min-w-0">
                            <span class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center text-xs font-extrabold shrink-0">${(r.bettor_name || '?').charAt(0)}</span>
                            <span class="truncate">${r.bettor_name || '—'}</span>
                        </span>
                        <span class="text-[11px] font-bold text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full whitespace-nowrap shrink-0">#${r.id}</span>
                    </div>
                    <div class="flex items-center gap-2 text-sm">
                        <span class="inline-block bg-emerald-100 text-emerald-700 text-xs font-bold px-1.5 py-0.5 rounded shrink-0">${r.formula}</span>
                        <span class="text-[11px] text-gray-400 font-mono truncate flex-1 min-w-0" title="${r.original}">${r.original}</span>
                    </div>
                    <div class="flex flex-wrap gap-1">${nums}</div>
                    <div class="border-t border-dashed border-red-200 pt-2 flex items-center justify-between gap-2 text-sm">
                        <div class="min-w-0">
                            <div class="text-[11px] text-gray-400 font-semibold uppercase">ငွေပမာဏ</div>
                            <div class="font-bold text-green-700 whitespace-nowrap">${fmt(r.amount)} Ks</div>
                        </div>
                        <div class="text-right text-[11px] text-gray-400 min-w-0 break-words leading-snug">
                            <i class="far fa-clock mr-1"></i>${r.time}
                        </div>
                    </div>
                    <div class="bg-red-50 border border-red-200 rounded-lg px-2 py-1.5 text-[11px] font-bold text-red-600 break-words leading-snug">
                        <i class="fas fa-exclamation-triangle mr-1"></i>${overInfo}
                    </div>
                `;
                body.appendChild(card);
            });
        }

        // ===== Active Sidebar Tab =====
        (function() {
            const pageMap = {'/records/': 'records', '/ledger/': 'ledger', '/chat/': 'chat', '/settings/': 'settings'};
            let active = '';
            for (const [p, v] of Object.entries(pageMap)) {
                if (location.pathname === p) { active = v; break; }
            }
            document.querySelectorAll('.tab-item[data-page]').forEach(el => {
                if (el.dataset.page === active) el.classList.add('active');
            });
            document.querySelectorAll('.tab-item-sidebar[data-page]').forEach(el => {
                if (el.dataset.page === active) el.classList.add('active');
            });
        })();
    </script>

    <!-- Footer -->
    <footer class="w-full mt-auto bg-slate-900 text-gray-400 safe-bottom">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-2 pb-[calc(4.25rem+env(safe-area-inset-bottom,0px))] lg:pb-2 flex flex-row items-center justify-center gap-3">
            <a href="https://github.com/DeeLiso" target="_blank" rel="noopener noreferrer" title="GitHub"
               class="flex items-center justify-center w-7 h-7 rounded-full bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white transition">
                <i class="fab fa-github text-sm"></i>
            </a>
            <a href="viber://chat?number=%2B959446534581" title="Viber"
               class="flex items-center justify-center w-7 h-7 rounded-full bg-purple-700 hover:bg-purple-600 text-white transition">
                <i class="fab fa-viber text-sm"></i>
            </a>
        </div>
    </footer>
    <script src="/static/js/pwa.js" defer></script>
</body>
</html>

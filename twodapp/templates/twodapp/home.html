<!DOCTYPE html>
<html lang="my" style="font-size: 16px;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>2DAP-3SPRO</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4338ca">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="2DAP-3SPRO">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/static/favicon-192x192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/static/icon-180.png" sizes="180x180">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-container {
            text-align: center;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .home-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .home-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            margin-bottom: 3rem;
        }
        .home-section {
            margin-bottom: 1.25rem;
        }
        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.25rem;
            transition: transform 0.15s, box-shadow 0.15s;
            border: none;
            cursor: pointer;
        }
        .home-btn:active { transform: scale(0.97); }
        .home-btn i { font-size: 1.5rem; }
        .btn-bettor {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }
        .btn-dealer {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: white;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
        }
        .sub-links {
            display: none;
            margin-top: 0.6rem;
            flex-direction: column;
            gap: 0.5rem;
        }
        .sub-links.open { display: flex; }
        .sub-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 1.25rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.12s;
            color: white;
        }
        .sub-link:active { transform: scale(0.97); }
        .section-bettor .sub-link { background: rgba(16, 185, 129, 0.2); }
        .section-dealer .sub-link { background: rgba(245, 158, 11, 0.2); }
        .home-footer {
            color: rgba(255,255,255,0.35);
            font-size: 0.7rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="home-title">2DAP-3SPRO</div>
        <div class="home-subtitle">Thai 2D Lottery Calculator</div>

        <div class="home-section section-bettor">
            <button class="home-btn btn-bettor" onclick="toggleSub('bettorSub')">
                <i class="fas fa-pen-to-square"></i>
                <div>
                    <div>Player</div>
                    <div style="font-size:0.7rem; font-weight:400; opacity:0.8;">Player</div>
                </div>
            </button>
            <div id="bettorSub" class="sub-links">
                <a href="/bet/?type=bettor" class="sub-link"><i class="fas fa-calculator"></i> Formula Parser</a>
            </div>
        </div>

        <div class="home-section section-dealer">
            <button class="home-btn btn-dealer" onclick="toggleSub('dealerSub')">
                <i class="fas fa-crown"></i>
                <div>
                    <div>Owner</div>
                    <div style="font-size:0.7rem; font-weight:400; opacity:0.8;">Owner</div>
                </div>
            </button>
            <div id="dealerSub" class="sub-links">
                <a href="/bet/?type=dealer" class="sub-link"><i class="fas fa-calculator"></i> Formula Parser</a>
                <a href="/ledger/" class="sub-link"><i class="fas fa-th"></i> Ledger (00–99)</a>
                <a href="/records/" class="sub-link"><i class="fas fa-list-ol"></i> မှတ်တမ်းစာရင်း</a>
            </div>
        </div>

        <div class="home-footer">Developer DeeLiso</div>
    </div>

    <script>
        function toggleSub(id) {
            document.getElementById(id).classList.toggle('open');
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("/sw.js")
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.error('SW registration failed:', err));
            });
        }
    </script>
    <script src="/static/js/pwa.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>အင်တာနက် မရှိပါ · 2DAP-3SPRO</title>
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Myanmar", sans-serif;
        text-align: center;
    }
    .card { width: 100%; max-width: 22rem; }
    .icon {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
    }
    h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
    p { font-size: 0.875rem; color: #94a3b8; margin: 0 0 1.5rem; line-height: 1.6; }
    button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 0.75rem;
        background: #4f46e5;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    .meta { margin-top: 1.25rem; font-size: 0.75rem; color: #475569; }
</style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>အင်တာနက် မရှိပါ</h1>
        <p>အင်တာနက် မချိတ်ဆက်နိုင်လို့ မှတ်တမ်းများကို မဖွင့်နိုင်ပါ။ ဆိုင်အမှတ် ပြန်ချိတ်ပြီး ပြန်ကြိုးစားကြည့်ပါ။</p>
        <button type="button" onclick="location.reload()">ပြန်ကြိုးစားကြည့်မည်</button>
        <div class="meta">2DAP-3SPRO</div>
    </div>
</body>
</html>
